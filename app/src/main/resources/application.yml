# AI 面试平台主配置

# 日志与服务端口
logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: ${SERVER_PORT:8200}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# OpenAPI / Swagger 文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: interview.guide.modules

# Spring 基础配置
spring:
  config:
    # IDEA、bootRun、Docker 均优先读取项目根目录或 app 上级目录的 .env。
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:classpath:voice-interview-opening.yml
  application:
    name: ai-interview-platform
  threads:
    virtual:
      # Java 21 虚拟线程，降低高并发请求下的平台线程占用。
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_guide}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 520MB
  redis:
    redisson:
      # 当前本地 Redis 默认无密码；如需密码，需要同步调整 Redisson 配置与 Redis 服务。
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          password: ${REDIS_PASSWORD:${APP_REDIS_PASSWORD:}}
          database: 0
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  ai:
    retry:
      # Spring AI 底层重试关闭到最小，业务层结构化输出自行处理重试。
      max-attempts: 1
      on-client-errors: false
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        remove-existing-vector-store-table: false

# 业务配置
app:
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:dev-only-change-me-at-least-32-characters}
    access-token-ttl-minutes: ${APP_AUTH_ACCESS_TOKEN_TTL_MINUTES:1440}
    admin:
      initialize-on-startup: ${APP_AUTH_ADMIN_INITIALIZE_ON_STARTUP:false}
      username: ${APP_AUTH_ADMIN_USERNAME:admin}
      password: ${APP_AUTH_ADMIN_PASSWORD:123456}
      display-name: ${APP_AUTH_ADMIN_DISPLAY_NAME:系统管理员}
      reset-password-on-startup: ${APP_AUTH_ADMIN_RESET_PASSWORD_ON_STARTUP:false}

  ai:
    # 系统默认 AI 设置；用户在设置页修改后保存到 user_ai_settings 表。
    model:
      # 单模型实例配置；新变量优先
      base-url: ${APP_AI_MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${APP_AI_MODEL_API_KEY:}
      chat-model: ${APP_AI_MODEL_CHAT_MODEL:qwen-turbo}
      embedding-model: ${APP_AI_MODEL_EMBEDDING_MODEL:text-embedding-v4}
      embedding-dimensions: ${APP_AI_MODEL_EMBEDDING_DIMENSIONS:1024}
      temperature: ${APP_AI_MODEL_TEMPERATURE:0.2}
    cloud-embedding:
      base-url: ${APP_AI_CLOUD_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${APP_AI_CLOUD_EMBEDDING_API_KEY:${APP_AI_MODEL_API_KEY:}}
      model: ${APP_AI_CLOUD_EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${APP_AI_CLOUD_EMBEDDING_DIMENSIONS:1024}
    advisors:
      message-chat-memory-max-messages: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_MAX_MESSAGES:120}
    rag:
      search:
        min-score-default: ${APP_AI_RAG_MIN_SCORE_DEFAULT:0.28}

  interview:
    # 普通模拟面试追问数与批量评估大小。
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    evaluation:
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}

  resume:
    # 简历临时上传目录与允许的文件 MIME 类型。
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  storage:
    # RustFS / S3
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY}
    secret-key: ${APP_STORAGE_SECRET_KEY}
    bucket: ${APP_STORAGE_BUCKET:interview-guide}
    region: ${APP_STORAGE_REGION:us-east-1}

  cors:
    # 前端本地开发端口白名单，多个地址用英文逗号分隔。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:4174,http://127.0.0.1:4174,http://localhost:4175,http://127.0.0.1:4175,http://localhost:80,http://127.0.0.1:80}

  voice-interview:
    qwen:
      asr:
        api-key: ${APP_VOICE_ASR_API_KEY:}
        turn-detection-silence-duration-ms: ${APP_VOICE_ASR_SILENCE_MS:2000}
      tts:
        api-key: ${APP_VOICE_TTS_API_KEY:}

# AI 面试平台主配置

# 日志与服务端口
logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: ${SERVER_PORT:8200}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# OpenAPI / Swagger 文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: interview.guide.modules

# Spring 基础配置
spring:
  config:
    # IDEA、bootRun、Docker 均优先读取项目根目录或 app 上级目录的 .env。
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:classpath:voice-interview-opening.yml
  application:
    name: ai-interview-platform
  threads:
    virtual:
      # Java 21 虚拟线程，降低高并发请求下的平台线程占用。
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_guide}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 520MB
  redis:
    redisson:
      # 当前本地 Redis 默认无密码；如需密码，需要同步调整 Redisson 配置与 Redis 服务。
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          password: ${REDIS_PASSWORD:${APP_REDIS_PASSWORD:}}
          database: 0
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  ai:
    retry:
      # Spring AI 底层重试关闭到最小，业务层结构化输出自行处理重试。
      max-attempts: 1
      on-client-errors: false
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        remove-existing-vector-store-table: false

# 业务配置
app:
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:dev-only-change-me-at-least-32-characters}
    access-token-ttl-minutes: ${APP_AUTH_ACCESS_TOKEN_TTL_MINUTES:1440}
    admin:
      initialize-on-startup: ${APP_AUTH_ADMIN_INITIALIZE_ON_STARTUP:false}
      username: ${APP_AUTH_ADMIN_USERNAME:admin}
      password: ${APP_AUTH_ADMIN_PASSWORD:123456}
      display-name: ${APP_AUTH_ADMIN_DISPLAY_NAME:系统管理员}
      reset-password-on-startup: ${APP_AUTH_ADMIN_RESET_PASSWORD_ON_STARTUP:false}

  async-task:
    rabbitmq:
      concurrent-consumers: ${APP_ASYNC_TASK_RABBITMQ_CONCURRENT_CONSUMERS:1}
      max-concurrent-consumers: ${APP_ASYNC_TASK_RABBITMQ_MAX_CONCURRENT_CONSUMERS:${APP_ASYNC_TASK_RABBITMQ_CONCURRENT_CONSUMERS:1}}
      prefetch-count: ${APP_ASYNC_TASK_RABBITMQ_PREFETCH_COUNT:10}

  ai:
    # 系统默认 AI 设置；用户在设置页修改后保存到 user_ai_settings 表。
    embedding-dimensions: ${APP_AI_EMBEDDING_DIMENSIONS:1024}
    agent-utils:
      skills-root: ${APP_AI_AGENT_UTILS_SKILLS_ROOT:classpath:skills}
    model:
      # 单模型实例配置；新变量优先
      base-url: ${APP_AI_MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${APP_AI_MODEL_API_KEY:}
      chat-model: ${APP_AI_MODEL_CHAT_MODEL:qwen-turbo}
      embedding-model: ${APP_AI_MODEL_EMBEDDING_MODEL:text-embedding-v4}
      embedding-dimensions: ${APP_AI_MODEL_EMBEDDING_DIMENSIONS:1024}
      temperature: ${APP_AI_MODEL_TEMPERATURE:0.2}
    cloud-embedding:
      base-url: ${APP_AI_CLOUD_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${APP_AI_CLOUD_EMBEDDING_API_KEY:${APP_AI_MODEL_API_KEY:}}
      model: ${APP_AI_CLOUD_EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${APP_AI_CLOUD_EMBEDDING_DIMENSIONS:1024}
    advisors:
      enabled: ${APP_AI_ADVISORS_ENABLED:true}
      tool-call-enabled: ${APP_AI_ADVISORS_TOOL_CALL_ENABLED:true}
      tool-call-conversation-history-enabled: ${APP_AI_ADVISORS_TOOL_CALL_CONVERSATION_HISTORY_ENABLED:false}
      stream-tool-call-responses: ${APP_AI_ADVISORS_STREAM_TOOL_CALL_RESPONSES:false}
      message-chat-memory-enabled: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_ENABLED:false}
      message-chat-memory-max-messages: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_MAX_MESSAGES:120}
      simple-logger-enabled: ${APP_AI_ADVISORS_SIMPLE_LOGGER_ENABLED:false}
    structured-max-attempts: ${APP_AI_STRUCTURED_MAX_ATTEMPTS:2}
    structured-include-last-error: ${APP_AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
    structured-retry-use-repair-prompt: ${APP_AI_STRUCTURED_RETRY_USE_REPAIR_PROMPT:true}
    structured-retry-append-strict-json-instruction: ${APP_AI_STRUCTURED_RETRY_APPEND_STRICT_JSON_INSTRUCTION:true}
    structured-error-message-max-length: ${APP_AI_STRUCTURED_ERROR_MESSAGE_MAX_LENGTH:200}
    structured-metrics-enabled: ${APP_AI_STRUCTURED_METRICS_ENABLED:true}
    rag:
      # 知识库 RAG 查询参数：短查询取更多候选，长查询收紧召回数量。
      rewrite:
        enabled: ${APP_AI_RAG_REWRITE_ENABLED:true}
      search:
        short-query-length: ${APP_AI_RAG_SHORT_QUERY_LENGTH:4}
        medium-query-length: ${APP_AI_RAG_MEDIUM_QUERY_LENGTH:12}
        topk-short: ${APP_AI_RAG_TOPK_SHORT:20}
        topk-medium: ${APP_AI_RAG_TOPK_MEDIUM:12}
        topk-long: ${APP_AI_RAG_TOPK_LONG:8}
        min-score-short: ${APP_AI_RAG_MIN_SCORE_SHORT:0.18}
        min-score-default: ${APP_AI_RAG_MIN_SCORE_DEFAULT:0.28}

  interview:
    # 普通模拟面试追问数与批量评估大小。
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    evaluation:
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}

  resume:
    # 简历临时上传目录与允许的文件 MIME 类型。
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  storage:
    # RustFS / S3
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY}
    secret-key: ${APP_STORAGE_SECRET_KEY}
    bucket: ${APP_STORAGE_BUCKET:interview-guide}
    region: ${APP_STORAGE_REGION:us-east-1}

  cors:
    # 前端本地开发端口白名单，多个地址用英文逗号分隔。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:4174,http://127.0.0.1:4174,http://localhost:4175,http://127.0.0.1:4175,http://localhost:80,http://127.0.0.1:80}

  voice-interview:
    # 语音面试全局开关与流式推送节奏。
    opening-audio-warmup-enabled: ${APP_VOICE_OPENING_AUDIO_WARMUP_ENABLED:false}
    llm-streaming-enabled: ${APP_VOICE_LLM_STREAMING_ENABLED:true}
    ai-stream-push-interval-ms: ${APP_VOICE_AI_STREAM_PUSH_INTERVAL_MS:180}
    ai-stream-min-chars-delta: ${APP_VOICE_AI_STREAM_MIN_CHARS_DELTA:12}
    ai-question-max-chars: ${APP_VOICE_AI_QUESTION_MAX_CHARS:120}
    chunked-audio-enabled: ${APP_VOICE_CHUNKED_AUDIO_ENABLED:true}
    tts-timeout-seconds: ${APP_VOICE_TTS_TIMEOUT_SECONDS:8}
    max-concurrent-tts-per-session: ${APP_VOICE_MAX_CONCURRENT_TTS_PER_SESSION:3}
    phase:
      # 各阶段时长和题量边界，用于控制语音面试节奏。
      intro:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_QUESTIONS:5}
      tech:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_QUESTIONS:3}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_QUESTIONS:8}
      project:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_QUESTIONS:5}
      hr:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_QUESTIONS:5}
    qwen:
      # DashScope 实时 ASR / TTS 配置；Key 可在设置页或 .env 中单独覆盖。
      asr:
        url: ${APP_VOICE_ASR_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
        model: ${APP_VOICE_ASR_MODEL:qwen3-asr-flash-realtime}
        api-key: ${APP_VOICE_ASR_API_KEY:}
        language: ${APP_VOICE_ASR_LANGUAGE:zh}
        format: ${APP_VOICE_ASR_FORMAT:pcm}
        sample-rate: ${APP_VOICE_ASR_SAMPLE_RATE:16000}
        enable-turn-detection: ${APP_VOICE_ASR_ENABLE_TURN_DETECTION:true}
        turn-detection-type: ${APP_VOICE_ASR_TURN_DETECTION_TYPE:server_vad}
        turn-detection-threshold: ${APP_VOICE_ASR_TURN_DETECTION_THRESHOLD:0.0}
        turn-detection-silence-duration-ms: ${APP_VOICE_ASR_SILENCE_MS:2000}
      tts:
        model: ${APP_VOICE_TTS_MODEL:qwen3-tts-flash-realtime}
        api-key: ${APP_VOICE_TTS_API_KEY:}
        voice: ${APP_VOICE_TTS_VOICE:Cherry}
        format: ${APP_VOICE_TTS_FORMAT:pcm}
        sample-rate: ${APP_VOICE_TTS_SAMPLE_RATE:24000}
        mode: ${APP_VOICE_TTS_MODE:commit}
        language-type: ${APP_VOICE_TTS_LANGUAGE_TYPE:Chinese}
        speech-rate: ${APP_VOICE_TTS_SPEECH_RATE:1.0}
        volume: ${APP_VOICE_TTS_VOLUME:60}
    rate-limit:
      # 语音面试 WebSocket 并发与频率限制。
      max-per-session: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_SESSION:10}
      max-per-ip: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_IP:3}
      max-concurrent: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_CONCURRENT:50}
    audio:
      # 前端录音与后端语音流处理的默认音频参数。
      codec: ${APP_VOICE_INTERVIEW_AUDIO_CODEC:opus}
      sample-rate: ${APP_VOICE_INTERVIEW_AUDIO_SAMPLE_RATE:16000}
      bit-rate: ${APP_VOICE_INTERVIEW_AUDIO_BIT_RATE:24000}
      channels: ${APP_VOICE_INTERVIEW_AUDIO_CHANNELS:1}
      chunk-duration: ${APP_VOICE_INTERVIEW_AUDIO_CHUNK_DURATION:2000}
